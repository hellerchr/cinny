name: Release Desktop App

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v4.12.3-desktop.2'
        required: true
  push:
    tags:
      - 'v*-desktop*'

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_glob: src-tauri/target/release/bundle/dmg/*.dmg
          - os: windows-latest
            artifact_glob: src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-latest
            artifact_glob: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              *.flatpak

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build desktop app
        run: npm run tauri:build

      - name: Build Flatpak bundle
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y flatpak flatpak-builder
          flatpak --user remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y flathub org.gnome.Platform//48 org.gnome.Sdk//48
          flatpak-builder --force-clean --repo=repo build-dir src-tauri/flatpak/app.cinny.desktop.yml
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          flatpak build-bundle repo "Cinny_${TAG#v}_x86_64.flatpak" app.cinny.desktop

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: ${{ matrix.artifact_glob }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
